
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    logging: *default-logging

    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b  # pg16, сборка 2026-08-13; обновлять осознанно (BACKUP.md)

    restart: unless-stopped

    environment:

      POSTGRES_DB: meridian

      POSTGRES_USER: meridian

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:

      - pg_data:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U meridian"]

      interval: 5s

      timeout: 5s

      retries: 5

  redis:
    logging: *default-logging

    image: redis:7-alpine

    restart: unless-stopped

    volumes:

      - redis_data:/data

    healthcheck:

      test: ["CMD", "redis-cli", "ping"]

      interval: 5s

      timeout: 3s

      retries: 5

  backend:
    logging: *default-logging

    build: ./backend
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/attachments:/app/attachments
      - ./backend/geoip:/app/geoip:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    environment:

      DATABASE_URL: postgresql+asyncpg://meridian:${POSTGRES_PASSWORD}@postgres:5432/meridian

      REDIS_URL: redis://redis:6379/0

      SECRET_KEY: ${SECRET_KEY}

      ENVIRONMENT: production
      COOKIE_SECURE: ${COOKIE_SECURE:-}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}




      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1/chat/completions}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-custom}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_FROM: ${SMTP_FROM}

      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}

    depends_on:

      postgres:

        condition: service_healthy

      redis:

        condition: service_healthy

      mailpit:

        condition: service_started

  recheck-worker:
    logging: *default-logging
    build: ./backend
    command: python -m app.services.recheck_worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://meridian:${POSTGRES_PASSWORD}@postgres:5432/meridian
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1/chat/completions}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-custom}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
  backend-test:
    logging: *default-logging
    build: ./backend
    entrypoint: ["sh", "-c", "sleep infinity"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
    environment:
      DATABASE_URL: postgresql+asyncpg://meridian:${POSTGRES_TEST_PASSWORD}@postgres-test:5432/meridian_test
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: "1"
      # Mistral убран 18.09 — единственный провайдер теперь Ollama на хосте
      # разработчика, доступ из контейнера через host.docker.internal (см.
      # extra_hosts ниже). Тесты бьют в реальную Ollama (медленнее, но
      # честнее, чем мокинг) — сознательный выбор Алексея 19.09.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1/chat/completions}
      OLLAMA_EMBED_URL: http://host.docker.internal:11434/api/embeddings
      CORS_ORIGINS: '["http://localhost:3000"]'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: noreply@meridian.local
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailpit:
    logging: *default-logging

    image: axllent/mailpit:latest

    restart: unless-stopped

  frontend:
    logging: *default-logging

    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        # Empty: the frontend calls the API at a relative address (same domain behind the proxy).
        # Local development sets the address in docker-compose.override.yml.
        NEXT_PUBLIC_API_URL: ""

    restart: unless-stopped

    depends_on:

      - backend



  postgres-test:
    logging: *default-logging
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b  # pg16, сборка 2026-08-13; обновлять осознанно (BACKUP.md)
    restart: unless-stopped
    environment:
      POSTGRES_DB: meridian_test
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
    volumes:
      - pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:

  pg_data:

  redis_data:

  pg_test_data:
